name: GDSBEDS Social Render
run-name: Render ${{ inputs.render_id }}

on:
  workflow_dispatch:
    inputs:
      render_id:
        description: Render job identifier
        required: true
        type: string
      manifest_base64:
        description: Base64-encoded render manifest JSON
        required: true
        type: string
      dry_run:
        description: Internal preview only
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: gdsbeds-render-${{ inputs.render_id }}
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RENDER_ID: ${{ inputs.render_id }}
      MANIFEST_BASE64: ${{ inputs.manifest_base64 }}
      DRY_RUN: ${{ inputs.dry_run }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Enforce dry-run boundary
        shell: bash
        run: test "$DRY_RUN" = "true"
      - name: Install PNG renderer
        run: npm install --no-save --no-audit --no-fund sharp@latest
      - name: Decode manifest
        shell: bash
        run: printf '%s' "$MANIFEST_BASE64" | base64 --decode > manifest.json
      - name: Validate manifest
        run: npm run validate -- --manifest manifest.json
      - name: Run contract tests
        run: npm test
      - name: Render SVG source previews
        run: npm run render -- --manifest manifest.json --output dist
      - name: Convert previews to PNG
        run: node src/png.mjs dist
      - name: Enforce render quality gate
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs/promises';
          import path from 'node:path';
          import sharp from 'sharp';
          const manifest = JSON.parse(await fs.readFile('manifest.json', 'utf8'));
          const result = JSON.parse(await fs.readFile('dist/result.json', 'utf8'));
          const pngs = (await fs.readdir('dist')).filter((name) => name.endsWith('.png')).sort();
          const expected = manifest.format === 'carousel' ? manifest.slides.length : 1;
          if (pngs.length !== expected) throw new Error(`Expected ${expected} PNG files, found ${pngs.length}.`);
          for (const name of pngs) {
            const meta = await sharp(path.join('dist', name)).metadata();
            if (meta.width !== 1080 || meta.height !== 1080 || meta.format !== 'png') throw new Error(`${name} failed 1080x1080 PNG validation.`);
          }
          if (result.media_embedded !== true) throw new Error('Renderer did not embed all media.');
          if (result.publication_ready !== false) throw new Error('publication_ready must remain false.');
          if (manifest.format === 'carousel') {
            const sources = manifest.slides.map((slide) => String(slide.fields?.['field.media'] || '').trim());
            if (sources.some((value) => !value) || new Set(sources).size !== sources.length) throw new Error('Carousel media sources must be present and distinct.');
            const required = ['asset_id','provider','photographer','source_page','license_name','license_url','verified_at','usage_scope'];
            manifest.slides.forEach((slide, index) => {
              for (const key of required) if (!String(slide.media_provenance?.[key] || '').trim()) throw new Error(`Slide ${index + 1} missing provenance field ${key}.`);
            });
          }
          const report = {ok:true,checked_at:new Date().toISOString(),png_count:pngs.length,expected_png_count:expected,dimensions:'1080x1080',media_embedded:true,distinct_media:manifest.format === 'carousel',provenance_complete:manifest.format === 'carousel',publication_ready:false};
          await fs.writeFile('dist/quality-report.json', JSON.stringify(report, null, 2) + '\n');
          console.log(JSON.stringify(report));
          NODE
      - name: Upload internal preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: gdsbeds-render-${{ inputs.render_id }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
