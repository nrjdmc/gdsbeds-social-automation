name: GDSBEDS Social Render
run-name: Render ${{ inputs.render_id }}
on:
  workflow_dispatch:
    inputs:
      render_id: {required: true, type: string}
      manifest_base64: {required: true, type: string}
      dry_run: {required: true, default: true, type: boolean}
permissions: {contents: read}
concurrency:
  group: gdsbeds-render-${{ inputs.render_id }}
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RENDER_ID: ${{ inputs.render_id }}
      MANIFEST_BASE64: ${{ inputs.manifest_base64 }}
      DRY_RUN: ${{ inputs.dry_run }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Enforce dry-run boundary
        run: test "$DRY_RUN" = "true"
      - name: Install renderer
        run: npm install --no-save --no-audit --no-fund sharp@latest
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Decode manifest
        run: printf '%s' "$MANIFEST_BASE64" | base64 --decode > manifest.json
      - name: Validate manifest
        run: npm run validate -- --manifest manifest.json
      - name: Render source frames
        run: npm run render -- --manifest manifest.json --output dist
      - name: Convert SVG frames to PNG
        run: node src/png.mjs dist
      - name: Build silent motion Reel MP4
        shell: bash
        run: |
          set -euo pipefail
          cp manifest.json dist/manifest.json
          FORMAT=$(node -p "JSON.parse(require('fs').readFileSync('manifest.json')).format")
          if [ "$FORMAT" = "reel" ]; then
            node -e "const fs=require('fs');const r=JSON.parse(fs.readFileSync('dist/result.json'));const p=fs.readdirSync('dist').filter(x=>x.endsWith('.png')).sort();fs.writeFileSync('dist/reel-scenes.tsv',p.map((x,i)=>x+'\t'+r.scene_durations[i]).join('\n')+'\n')"
            : > dist/reel-parts.txt
            INDEX=0
            while IFS=$'\t' read -r PNG DURATION; do
              INDEX=$((INDEX+1))
              FRAMES=$(node -p "Math.round(Number(process.argv[1])*30)" "$DURATION")
              FADE_OUT=$(node -p "Math.max(0,Number(process.argv[1])-0.35)" "$DURATION")
              PART=$(printf 'reel-part-%02d.mp4' "$INDEX")
              ffmpeg -nostdin -y -loop 1 -i "dist/$PNG" -vf "scale=1200:2134:force_original_aspect_ratio=increase,crop=1200:2134,zoompan=z='min(zoom+0.00045,1.08)':x='iw/2-(iw/zoom/2)':y='ih/2-(ih/zoom/2)':d=${FRAMES}:s=1080x1920:fps=30,fade=t=in:st=0:d=0.35,fade=t=out:st=${FADE_OUT}:d=0.35,format=yuv420p" -t "$DURATION" -an -c:v libx264 -preset medium -crf 20 -movflags +faststart "dist/$PART"
              printf "file '%s'\n" "$PART" >> dist/reel-parts.txt
            done < dist/reel-scenes.tsv
            (cd dist && ffmpeg -nostdin -y -f concat -safe 0 -i reel-parts.txt -c copy -an -movflags +faststart "$RENDER_ID.mp4")
            rm -f dist/reel-part-*.mp4 dist/reel-parts.txt dist/reel-scenes.tsv
          fi
      - name: Enforce quality gate
        shell: bash
        run: |
          node -e "const fs=require('fs'),path=require('path'),cp=require('child_process'),sharp=require('sharp');(async()=>{const m=JSON.parse(fs.readFileSync('manifest.json')),r=JSON.parse(fs.readFileSync('dist/result.json')),files=fs.readdirSync('dist');if(r.publication_ready!==false||r.media_embedded!==true)throw Error('Preview safety or media embedding failed.');let q={ok:true,checked_at:new Date().toISOString(),format:m.format,publication_ready:false,media_embedded:true};if(m.format==='reel'){const mp4s=files.filter(x=>x.endsWith('.mp4')),mp4=mp4s[0];if(mp4s.length!==1)throw Error('Reel must contain exactly one final MP4.');const p=JSON.parse(cp.execFileSync('ffprobe',['-v','error','-show_entries','stream=codec_type,codec_name,width,height,pix_fmt','-show_entries','format=duration','-of','json',path.join('dist',mp4)],{encoding:'utf8'}));const v=p.streams.find(x=>x.codec_type==='video'),a=p.streams.filter(x=>x.codec_type==='audio'),d=Number(p.format.duration);if(!v||v.codec_name!=='h264'||v.width!==1080||v.height!==1920||v.pix_fmt!=='yuv420p'||a.length!==0||d<18||d>22)throw Error('Reel ffprobe validation failed.');q={...q,mp4_count:1,mp4,dimensions:'1080x1920',silent:true,audio_streams:0,video_codec:v.codec_name,pixel_format:v.pix_fmt,duration_seconds:d,motion_effect:'ken_burns_zoom',provenance_complete:m.scenes.every(s=>s.media_provenance)};}else{const pngs=files.filter(x=>x.endsWith('.png')),expected=m.format==='carousel'?m.slides.length:1;if(pngs.length!==expected)throw Error('PNG count mismatch.');for(const n of pngs){const x=await sharp(path.join('dist',n)).metadata();if(x.width!==1080||x.height!==1080)throw Error('PNG dimensions invalid.')}const media=m.format==='carousel'?m.slides.map(s=>s.fields['field.media']):[m.fields['field.media']];const provenance=m.format==='carousel'?m.slides.every(s=>s.media_provenance):true;q={...q,png_count:pngs.length,expected_png_count:expected,dimensions:'1080x1080',distinct_media:new Set(media).size===media.length,provenance_complete:provenance};}fs.writeFileSync('dist/quality-report.json',JSON.stringify(q,null,2)+'\n');console.log(JSON.stringify(q));})()"
      - uses: actions/upload-artifact@v4
        with:
          name: gdsbeds-render-${{ inputs.render_id }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
