name: GDSBEDS Social Render
run-name: Render ${{ inputs.render_id }}
on:
  workflow_dispatch:
    inputs:
      render_id: {required: true, type: string}
      manifest_base64: {required: true, type: string}
      dry_run: {required: true, default: true, type: boolean}
permissions: {contents: read}
concurrency:
  group: gdsbeds-render-${{ inputs.render_id }}
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RENDER_ID: ${{ inputs.render_id }}
      MANIFEST_BASE64: ${{ inputs.manifest_base64 }}
      DRY_RUN: ${{ inputs.dry_run }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Enforce dry-run boundary
        run: test "$DRY_RUN" = "true"
      - name: Install renderer
        run: npm install --no-save --no-audit --no-fund sharp@latest
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Decode manifest
        run: printf '%s' "$MANIFEST_BASE64" | base64 --decode > manifest.json
      - name: Validate manifest
        run: npm run validate -- --manifest manifest.json
      - name: Render source frames
        run: npm run render -- --manifest manifest.json --output dist
      - name: Convert SVG frames to PNG
        run: node src/png.mjs dist
      - name: Build silent Reel MP4
        shell: bash
        run: |
          FORMAT=$(node -p "JSON.parse(require('fs').readFileSync('manifest.json')).format")
          if [ "$FORMAT" = "reel" ]; then
            node --input-type=module <<'NODE'
            import fs from 'node:fs/promises';
            const r=JSON.parse(await fs.readFile('dist/result.json','utf8'));
            const pngs=(await fs.readdir('dist')).filter(x=>x.endsWith('.png')).sort();
            let text='';
            pngs.forEach((p,i)=>{text+=`file '${p}'\nduration ${r.scene_durations[i]}\n`});
            text+=`file '${pngs.at(-1)}'\n`;
            await fs.writeFile('dist/reel-concat.txt',text);
            NODE
            (cd dist && ffmpeg -y -f concat -safe 0 -i reel-concat.txt -vf "scale=1080:1920,format=yuv420p" -r 30 -an -c:v libx264 -movflags +faststart "$RENDER_ID.mp4")
          fi
      - name: Enforce quality gate
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs/promises';import path from 'node:path';import sharp from 'sharp';import {execFileSync} from 'node:child_process';
          const m=JSON.parse(await fs.readFile('manifest.json','utf8')),r=JSON.parse(await fs.readFile('dist/result.json','utf8')),files=await fs.readdir('dist');
          if(r.publication_ready!==false||r.media_embedded!==true)throw new Error('Preview safety or media embedding failed.');
          let report={ok:true,checked_at:new Date().toISOString(),format:m.format,publication_ready:false,media_embedded:true};
          if(m.format==='reel'){const mp4=files.find(x=>x.endsWith('.mp4'));if(!mp4)throw new Error('Reel MP4 missing.');const p=JSON.parse(execFileSync('ffprobe',['-v','error','-select_streams','v:0','-show_entries','stream=codec_name,width,height,pix_fmt','-show_entries','format=duration','-of','json',path.join('dist',mp4)],{encoding:'utf8'}));const s=p.streams[0],d=Number(p.format.duration);if(s.codec_name!=='h264'||s.width!==1080||s.height!==1920||s.pix_fmt!=='yuv420p'||d<1)throw new Error('Reel ffprobe validation failed.');report={...report,mp4,codec:s.codec_name,width:s.width,height:s.height,pixel_format:s.pix_fmt,duration_seconds:d,audio_present:false};}else{const pngs=files.filter(x=>x.endsWith('.png'));const expected=m.format==='carousel'?m.slides.length:1;if(pngs.length!==expected)throw new Error('PNG count mismatch.');for(const n of pngs){const x=await sharp(path.join('dist',n)).metadata();if(x.width!==1080||x.height!==1080)throw new Error('PNG dimensions invalid.')}report={...report,png_count:pngs.length,dimensions:'1080x1080'};}
          await fs.writeFile('dist/quality-report.json',JSON.stringify(report,null,2)+'\n');console.log(JSON.stringify(report));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: gdsbeds-render-${{ inputs.render_id }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
